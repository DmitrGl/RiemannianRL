[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "riemannianrl"
version = "0.1.0"
description = "Riemannian Reinforcement Learning glider simulation environment"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
"Programming Language :: Python :: 3",
"Operating System :: OS Independent",
]
dependencies = [
"gymnasium",
"numpy",
"sympy",
"torch",
"pyyaml",
]

[tool.setuptools]
packages = ["agent", "env", "geometry", "scripts"]