# ppo_config.yaml
model:
  hidden_size: 64

training:
  total_timesteps: 100000
  rollout_steps: 2048
  batch_size: 64
  epochs: 10
  gamma: 0.99
  lam: 0.95
  epsilon_clip: 0.2 
  target_kl: 0.015
  ent_coef: 0.005

environment:
  timeout: 10
  cord_limit: 7.0
  maximum_thrust: 30
  complete_region: 0.1
  distance_reward_scale: 10
  mu_gl: 1
  sigma_gl: 2
  mu_tg: 0
  sigma_tg: 0
  mu_gl_vel: 0
  sigma_gl_vel: 1
  mu_tg_vel: 0
  sigma_tg_vel: 1
  N: 10

actor_optimizer:
  lr: 0.0003
  
  weight_decay: 0.0

critic_optimizer:
  lr: 0.0003
  
  weight_decay: 0.0

logging:
  log_interval: 30
  video_interval: 100
  save_dir: "./runs"
  use_wandb: false
  wandb_project: "riemannian-rl-glider"
  log_histograms: false